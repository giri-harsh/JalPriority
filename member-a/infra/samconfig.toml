# SAM CLI defaults for the JalPriority AI Member A stack. NOT deployed: no AWS credentials were available.
# From member-a/:
#   sam build -t infra/template.yaml
#   sam deploy --config-file infra/samconfig.toml --parameter-overrides SharedJwtSecret=<secret>
version = 0.1

[default.global.parameters]
stack_name = "jalpriority-a"

[default.deploy.parameters]
stack_name = "jalpriority-a"
region = "ap-south-1"
resolve_image_repos = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
tags = "project=jalpriority owner=member-a"

[default.validate.parameters]
lint = true
