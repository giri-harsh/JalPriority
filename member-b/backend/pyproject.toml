[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jp_b"
version = "1.0.0"
description = "JalPriority AI - Member B API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "pyjwt==2.10.1",
    "boto3==1.35.90",
    "mangum==0.19.0",
    "orjson==3.10.12"
]
